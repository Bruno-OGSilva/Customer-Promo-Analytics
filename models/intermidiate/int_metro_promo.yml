version: 2

models:
  - name: int_metro_promo
    description: >
      Intermediate banner-level promo flags and % off for Metro.
      Aggregates POS to banner+UPC+week, computes weighted avg price,
      compares to the 14-week rolling max, and buckets % off.
    config:
      tags: ['promo', 'metro', 'intermediate']
    meta:
      owner: Bruno Silva
      owner_slack: '@bruno'
      purpose: 'Promo detection and depth by banner'
      inputs: ['stg_metro_sales', 'int_metro_stores', 'calendar']
      language: sql
      notes: 'Rolling window ~14w; reprocess last ~16w in incremental runs'

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['retail_group','banner','upc_no','week_index']

    columns:
      - name: retail_group
        description: "Retail group identifier (Metro)."
        tests:
          - not_null

      - name: banner
        description: "Metro banner name used for promo grouping."
        tests:
          - not_null

      - name: upc_no
        description: "UPC (string or numeric-as-string) for the item."
        tests:
          - not_null

      - name: product
        description: "Product description for the UPC."

      - name: week_end_date
        description: "Business week end date."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('calendar')
                field: week_end_date

      - name: week_index
        description: "Sequential business week index from the calendar table."
        tests:
          - not_null

      - name: dollar_sales
        description: "Sum of dollar sales for the banner+UPC+week (rounded to 2 dp)."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "dollar_sales >= 0"

      - name: unit_sales
        description: "Sum of unit sales for the banner+UPC+week."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "unit_sales >= 0"

      - name: avg_price
        description: "Weighted average price = SUM($)/SUM(units) for the week (rounded to 2 dp)."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "avg_price is null or avg_price >= 0"

      - name: max_price_14w
        description: "Rolling 14-week max of avg_price within banner+UPC (rounded to 2 dp)."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "max_price_14w is null or max_price_14w >= 0"

      - name: pct_off
        description: "Percent off vs 14-week max. Rounded to 4 dp. Null if reference is zero or null."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "pct_off is null or (pct_off >= 0 and pct_off <= 1)"

      - name: pct_off_bucket
        description: "Promo depth bucket."
        tests:
          - accepted_values:
              arguments:
                values: ['Regular','5-10%','10-20%','20%+']

      - name: is_promo_week
        description: "True if avg_price <= 95% of the 14-week max; else false."
